name: realselect

services:
  api:
    container_name: realselect-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-na-vps}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 3333
      TZ: America/Sao_Paulo
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - player-photos:/app/apps/api/uploads
    networks:
      - realselect
      - postgres
    restart: unless-stopped

  web:
    container_name: realselect-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_URL: http://api:3333
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - realselect
    restart: unless-stopped

volumes:
  player-photos:

networks:
  realselect:
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:?Defina POSTGRES_NETWORK no .env}
