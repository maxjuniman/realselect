services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: file:/data/realselect.db
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-na-vps}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@realselect.fc}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-realselect2026}
      CORS_ORIGIN: "*"
      PORT: 3333
    volumes:
      - realselect-data:/data
    ports:
      - "3333:3333"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_URL: http://api:3333
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  realselect-data:
