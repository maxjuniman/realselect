name: Deploy

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma generate só lê a variável; este endereço não é o banco da VPS
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/realselect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check VPS SSH port
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ]; then
            echo "Secret VPS_HOST vazio."
            exit 1
          fi
          echo "Testando TCP ${VPS_HOST}:22 ..."
          for attempt in 1 2 3 4 5 6 7 8; do
            if timeout 8 bash -c "exec 3<>/dev/tcp/${VPS_HOST}/22" 2>/dev/null; then
              echo "Porta 22 responsiva (tentativa ${attempt})."
              exit 0
            fi
            echo "Porta 22 indisponível (tentativa ${attempt}/8), aguardando..."
            sleep $((attempt * 5))
          done
          echo "Não foi possível abrir TCP na porta 22 da VPS a partir do GitHub Actions."
          echo "Verifique firewall/fail2ban/security group e se VPS_HOST aponta para o IP/host correto."
          exit 1

      - name: Deploy via SSH (1/3)
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_DEPLOY_KEY: ${{ secrets.VPS_GITHUB_DEPLOY_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          protocol: tcp4
          timeout: 60s
          envs: GITHUB_DEPLOY_KEY,GITHUB_PAT,DEPLOY_BRANCH,APP_DIR
          command_timeout: 25m
          script_stop: true
          script_path: scripts/vps-deploy.sh

      - name: Wait before SSH retry 2
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "Deploy SSH falhou (1/3). Nova tentativa em 20s..."
          sleep 20

      - name: Deploy via SSH (2/3)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_DEPLOY_KEY: ${{ secrets.VPS_GITHUB_DEPLOY_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          protocol: tcp4
          timeout: 60s
          envs: GITHUB_DEPLOY_KEY,GITHUB_PAT,DEPLOY_BRANCH,APP_DIR
          command_timeout: 25m
          script_stop: true
          script_path: scripts/vps-deploy.sh

      - name: Wait before SSH retry 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "Deploy SSH falhou (2/3). Última tentativa em 30s..."
          sleep 30

      - name: Deploy via SSH (3/3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_DEPLOY_KEY: ${{ secrets.VPS_GITHUB_DEPLOY_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          protocol: tcp4
          timeout: 60s
          envs: GITHUB_DEPLOY_KEY,GITHUB_PAT,DEPLOY_BRANCH,APP_DIR
          command_timeout: 25m
          script_stop: true
          script_path: scripts/vps-deploy.sh

      - name: Ensure deploy succeeded
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success' && steps.deploy3.outcome != 'success'
        run: |
          echo "Deploy SSH falhou nas 3 tentativas."
          exit 1
